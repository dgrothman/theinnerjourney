                  content: '<h1 class="default-heading1" style="text-align: center; margin: 0; font-size: 42px; line-height: 1.1;"><span style="color: #f5ead8;">You''re on the list.</span></h1><p style="text-align: center; margin: 12px 0 0;"><span style="color: #e6eadd; font-size: 18px;">Thanks for joining us, {{ contact.FIRSTNAME }}.</span></p>'
