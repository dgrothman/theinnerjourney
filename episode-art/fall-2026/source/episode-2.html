<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@600;700&display=block">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1000px; height: 1000px; overflow: hidden; }
  body { background: #f5ead8; font-family: Figtree, sans-serif; color: #201e1d; position: relative; }

  .brand b { font: 400 44px/1 Caprasimo, serif; }
  .brand span { display: block; font: 700 22px/1.3 Figtree, sans-serif; color: #8c491a; letter-spacing: .06em; margin-top: 6px; }
  .main { margin-top: auto; }
  .pill { display: inline-block; background: #7a8a5e; color: #f9f4ed; font: 700 30px/1 Figtree, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 18px 30px; border-radius: 999px; }
  h1 { font: 400 150px/0.98 Caprasimo, serif; letter-spacing: -0.01em; margin-top: 30px; }
  h1 em { font-style: normal; color: #c67139; }
  .foot { margin-top: 38px; font: 700 28px/1 Figtree, sans-serif; color: #645c50; letter-spacing: .04em; }
</style></head><body>
